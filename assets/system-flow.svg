<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="Engineering flow — AI-assisted steps surrounded by deterministic tests, validation and controls">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .dim { fill: #8b949e; font-size: 13px; }
      .idx { fill: #3fb950; font-size: 12px; }
      .lbl { fill: #c9d1d9; font-size: 15px; }
      .hl  { fill: #7ee787; font-size: 15px; }
      .nhl { fill: #3fb950; font-size: 13px; }
      .note{ fill: #8b949e; font-size: 13px; }
    </style>
  </defs>

  <rect width="880" height="540" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="878" height="538" rx="15" fill="none" stroke="#21262d"/>

  <text x="40" y="52" class="dim">// engineering flow — deterministic controls around AI-assisted steps</text>

  <!-- boxes: top_i = 84 + i*62, height 44, x 56, width 360 -->
  <rect x="56" y="84" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="111" class="idx">01</text>
  <text x="118" y="111" class="lbl">Problem</text>

  <rect x="56" y="146" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="173" class="idx">02</text>
  <text x="118" y="173" class="lbl">Specification</text>

  <rect x="56" y="208" width="360" height="44" rx="8" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950"/>
  <text x="78" y="235" class="idx">03</text>
  <text x="118" y="235" class="hl">Agent-assisted implementation</text>

  <rect x="56" y="270" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="297" class="idx">04</text>
  <text x="118" y="297" class="lbl">Tests</text>

  <rect x="56" y="332" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="359" class="idx">05</text>
  <text x="118" y="359" class="lbl">Validation</text>

  <rect x="56" y="394" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="421" class="idx">06</text>
  <text x="118" y="421" class="lbl">Deployment</text>

  <rect x="56" y="456" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="483" class="idx">07</text>
  <text x="118" y="483" class="lbl">Observability</text>

  <!-- connectors (line + downward arrowhead) between boxes at x = 236 -->
  <line x1="236" y1="129" x2="236" y2="138" stroke="#8b949e" stroke-opacity="0.5"/>
  <polygon points="230,138 242,138 236,147" fill="#8b949e" fill-opacity="0.6"/>
  <line x1="236" y1="191" x2="236" y2="200" stroke="#8b949e" stroke-opacity="0.5"/>
  <polygon points="230,200 242,200 236,209" fill="#8b949e" fill-opacity="0.6"/>
  <line x1="236" y1="253" x2="236" y2="262" stroke="#8b949e" stroke-opacity="0.5"/>
  <polygon points="230,262 242,262 236,271" fill="#8b949e" fill-opacity="0.6"/>
  <line x1="236" y1="315" x2="236" y2="324" stroke="#8b949e" stroke-opacity="0.5"/>
  <polygon points="230,324 242,324 236,333" fill="#8b949e" fill-opacity="0.6"/>
  <line x1="236" y1="377" x2="236" y2="386" stroke="#8b949e" stroke-opacity="0.5"/>
  <polygon points="230,386 242,386 236,395" fill="#8b949e" fill-opacity="0.6"/>
  <line x1="236" y1="439" x2="236" y2="448" stroke="#8b949e" stroke-opacity="0.5"/>
  <polygon points="230,448 242,448 236,457" fill="#8b949e" fill-opacity="0.6"/>

  <!-- callout for the AI-assisted step -->
  <line x1="416" y1="230" x2="470" y2="230" stroke="#3fb950" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  <text x="478" y="222" class="nhl">agent-assisted step</text>
  <text x="478" y="240" class="note">guarded by deterministic tests,</text>
  <text x="478" y="258" class="note">validation &amp; operational controls</text>
</svg>
